services:

  ctf-analyzer:

    build: .

    container_name:
      h4g-ctf-analyzer

    ports:
      - "8000:8000"

    volumes:
      - ./workspace:/workspace
      - ./config:/app/config:ro

    environment:
      CTF_WORKSPACE: /workspace
      CTF_CONFIG: /app/config/config.yaml
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      H4G_AI_MODEL: ${H4G_AI_MODEL:-gpt-5.6}

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 256

    mem_limit: 2g

    restart: unless-stopped
